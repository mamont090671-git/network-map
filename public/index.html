<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карта локальной сети</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --surface: #16213e;
        --surface2: #0f3460;
        --accent: #e94560;
        --accent2: #533483;
        --text: #eee;
        --text-dim: #aaa;
        --node-w: 300px;
        --node-h: 120px;
        --grid: 20px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #toolbar {
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid #333;
        z-index: 100;
        flex-wrap: wrap;
        align-items: center;
      }
      #toolbar button,
      #toolbar select {
        padding: 6px 14px;
        border: 1px solid #444;
        border-radius: 6px;
        background: var(--surface2);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        transition: background 0.15s;
      }
      #toolbar button:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
      #toolbar button.primary {
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      #toolbar button.primary:hover {
        background: #c0392b;
      }
      #toolbar .sep {
        width: 1px;
        height: 28px;
        background: #444;
      }
      #toolbar .status {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-dim);
      }
      #toolbar .status.saved {
        color: #2ecc71;
      }
      #canvas-wrap {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #222 0%, var(--bg) 100%);
      }
      #canvas-wrap::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: var(--grid) var(--grid);
        pointer-events: none;
        z-index: 0;
      }
      #canvas {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
      }
      #svg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: auto;
        z-index: 1;
      }
      #svg-layer path {
        pointer-events: stroke;
        cursor: pointer;
      }
      #svg-layer path:hover {
        stroke-width: 8;
        filter: brightness(1.3);
      }
      .node-card {
        position: absolute;
        width: var(--node-w);
        height: var(--node-h);
        background: var(--surface);
        border: 2px solid var(--surface2);
        border-radius: 12px;
        cursor: grab;
        user-select: none;
        display: flex;
        flex-direction: column;
        z-index: 10;
        transition:
          box-shadow 0.15s,
          border-color 0.15s;
      }
      .node-card:hover {
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(233, 69, 96, 0.2);
      }
      .node-card.dragging {
        cursor: grabbing;
        z-index: 50;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        opacity: 0.92;
      }
      .node-card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.35);
      }
      .node-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px 2px;
        font-weight: 600;
        font-size: 14px;
        pointer-events: none;
      }
      .node-header .icon {
        font-size: 18px;
      }
      .node-body {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        font-size: 12px;
        color: var(--text-dim);
        pointer-events: none;
      }
      .node-body .ip-col {
        display: flex;
        align-items: baseline;
        gap: 3px;
        margin-right: 8px;
      }
      .node-body .ip-label {
        font-size: 9px;
        color: var(--text-dim);
        opacity: 0.5;
        text-transform: uppercase;
        min-width: 14px;
      }
      .node-body .ip-port {
        font-size: 11px;
        color: var(--text-dim);
        opacity: 0.7;
      }
      .lh-badge {
        font-size: 10px;
        background: #e94560;
        color: #fff;
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: 4px;
        font-weight: bold;
      }
      .node-actions {
        position: absolute;
        top: -8px;
        right: -8px;
        display: none;
        gap: 2px;
      }
      .node-card:hover .node-actions {
        display: flex;
      }
      .node-actions button {
        width: 22px;
        height: 22px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface2);
        color: var(--text);
        transition: background 0.15s;
      }
      .node-actions button.del:hover {
        background: var(--accent);
      }
      .node-actions button.edit:hover {
        background: var(--accent2);
      }
      .conn-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid var(--surface);
        cursor: crosshair;
        z-index: 20;
        opacity: 0;
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      .node-card:hover .conn-dot {
        opacity: 1;
      }
      .conn-dot:hover {
        transform: scale(1.5);
      }
      .conn-dot.top {
        top: -6px;
        left: calc(50% - 6px);
      }
      .conn-dot.bottom {
        bottom: -6px;
        left: calc(50% - 6px);
      }
      .conn-dot.left {
        left: -6px;
        top: calc(50% - 6px);
      }
      .conn-dot.right {
        right: -6px;
        top: calc(50% - 6px);
      }
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal {
        background: var(--surface);
        border: 1px solid #444;
        border-radius: 12px;
        padding: 24px;
        min-width: 360px;
        max-width: 90vw;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .modal h3 {
        margin-bottom: 16px;
        font-size: 18px;
      }
      .modal .field {
        margin-bottom: 12px;
      }
      .modal .field label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .modal .field input,
      .modal .field select,
      .modal .field textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #555;
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }
      .modal .field input:focus,
      .modal .field select:focus {
        border-color: var(--accent);
      }
      .modal .row {
        display: flex;
        gap: 10px;
      }
      .modal .row .field {
        flex: 1;
      }
      .modal .btns {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 18px;
      }
      .modal .btns button {
        padding: 8px 20px;
        border: 1px solid #555;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        background: var(--surface2);
        color: var(--text);
        transition: background 0.15s;
      }
      .modal .btns button:hover {
        background: #555;
      }
      .modal .btns button.primary {
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      .modal .btns button.primary:hover {
        background: #c0392b;
      }
      .link-popup {
        position: absolute;
        background: var(--surface);
        border: 2px solid var(--accent);
        border-radius: 10px;
        padding: 8px;
        z-index: 300;
        display: none;
        min-width: 200px;
        box-shadow: 0 8px 32px rgba(233, 69, 96, 0.4);
      }
      .link-popup.open {
        display: block;
      }
      .link-popup button {
        display: block;
        width: 100%;
        padding: 10px 12px;
        border: none;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        font-size: 14px;
        border-radius: 6px;
        margin-bottom: 4px;
      }
      .link-popup button:last-child {
        margin-bottom: 0;
      }
      .link-popup button:hover {
        background: var(--surface2);
      }
      .link-popup button.del {
        color: #e94560;
        font-weight: 600;
        border: 1px solid rgba(233, 69, 96, 0.3);
        background: rgba(233, 69, 96, 0.1);
      }
      .link-popup button.del:hover {
        background: #e94560;
        color: #fff;
      }
      .node-popup {
        position: absolute;
        background: var(--surface);
        border: 1px solid #555;
        border-radius: 8px;
        padding: 10px;
        z-index: 300;
        display: none;
        min-width: 180px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .node-popup.open {
        display: block;
      }
      .node-popup button {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border: none;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        font-size: 13px;
        border-radius: 4px;
      }
      .node-popup button:hover {
        background: var(--surface2);
      }
      .node-popup button.del:hover {
        color: var(--accent);
      }
      .node-popup .separator {
        height: 1px;
        background: #444;
        margin: 4px 0;
      }
      #minimap {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 180px;
        height: 120px;
        background: rgba(22, 33, 62, 0.9);
        border: 1px solid #444;
        border-radius: 8px;
        overflow: hidden;
        z-index: 50;
      }
      #minimap canvas {
        width: 100%;
        height: 100%;
      }
      #zoom-controls {
        position: absolute;
        bottom: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 50;
      }
      #zoom-controls button {
        width: 36px;
        height: 36px;
        border: 1px solid #444;
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #zoom-controls button:hover {
        background: var(--surface2);
      }
      #help-tip {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(22, 33, 62, 0.95);
        border: 1px solid #444;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-dim);
        z-index: 50;
        white-space: nowrap;
      }
      .link-type-picker {
        position: absolute;
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 10px;
        padding: 10px 14px;
        z-index: 400;
        box-shadow: 0 8px 32px rgba(233, 69, 96, 0.3);
        display: none;
      }
      .link-type-picker.open {
        display: block;
      }
      .link-type-picker .ltl {
        font-size: 11px;
        color: var(--text-dim);
        margin-bottom: 6px;
        text-align: center;
      }
      .link-type-picker .ltb {
        display: flex;
        gap: 6px;
      }
      .link-type-picker .lt-btn {
        width: 36px;
        height: 36px;
        border: 2px solid transparent;
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .link-type-picker .lt-btn:hover {
        background: var(--surface2);
      }
      .link-type-picker .lt-btn.active {
        border-color: var(--accent);
        background: var(--surface2);
      }
      .link-type-picker .lt-btn[data-type='physical'].active {
        border-color: #27ae60;
      }
      .link-type-picker .lt-btn[data-type='wifi'].active {
        border-color: #2980b9;
      }
      .link-type-picker .lt-btn[data-type='virtual'].active {
        border-color: #8e44ad;
      }

      /* ===== Связи: группа с hover ===== */
      .link-group {
        cursor: pointer;
      }
      .link-group .link-path {
        opacity: 0.8;
        transition:
          stroke-width 0.15s,
          opacity 0.15s;
      }
      .link-group:hover .link-path {
        stroke-width: 4.5;
        opacity: 1;
      }
      .link-group .link-del-btn {
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .link-group:hover .link-del-btn {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button class="primary" onclick="openAddNode()">＋ Узел</button>
      <button onclick="startLinkMode()">🔗 Связь</button>
      <div class="sep"></div>
      <button onclick="zoomIn()">＋</button>
      <button onclick="zoomOut()">－</button>
      <button onclick="resetView()">⟲ Сброс</button>
      <div class="sep"></div>
      <button onclick="exportMap()">📥 Экспорт</button>
      <button onclick="openNetSettings()">⚙️ Настройки</button>
      <button onclick="exportNebulaConfig()">🌐 Nebula</button>
      <button onclick="document.getElementById('import-input').click()">📤 Импорт</button>
      <input
        type="file"
        id="import-input"
        accept=".json"
        style="display: none"
        onchange="importMap(event)"
      />
      <div class="sep"></div>
      <button
        onclick="shutdownServer()"
        style="background: #c0392b; border-color: #c0392b; color: #fff"
      >
        ⏹ Стоп
      </button>
      <span class="status" id="status-text"></span>
    </div>
    <div id="canvas-wrap">
      <div id="canvas">
        <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="minimap"><canvas id="minimap-canvas"></canvas></div>
      <div id="zoom-controls">
        <button onclick="zoomIn()">＋</button>
        <button onclick="zoomOut()">－</button>
        <button onclick="resetView()">⟲</button>
      </div>
      <div id="help-tip">
        Колесо мыши — масштаб · Перетаскивание фона — пан · ПКМ на узле — меню · Тяни от
        точки-коннектора — новая связь · 📶 Выбор типа внизу
      </div>
    </div>
    <div class="modal-overlay" id="node-modal">
      <div class="modal">
        <h3 id="node-modal-title">Новый узел</h3>
        <div class="field">
          <label>Название</label>
          <input id="nm-label" placeholder="Название узла" />
        </div>
        <div class="row">
          <div class="field">
            <label>Тип</label>
            <select id="nm-type">
              <option value="server">🖥 Сервер</option>
              <option value="switch">🔀 Свитч</option>
              <option value="router">🌐 Роутер</option>
              <option value="firewall">🛡 Фаервол</option>
              <option value="pc">💻 Компьютер</option>
              <option value="printer">🖨 Принтер</option>
              <option value="storage">💾 Хранилище</option>
              <option value="phone">📱 Телефон</option>
              <option value="ap">📡 Точка доступа</option>
              <option value="other">⚙️ Другое</option>
            </select>
          </div>
          <div class="field">
            <label>IP Nebula</label>
            <input id="nm-ip-nebula" placeholder="10.128.x.x" />
          </div>
          <div class="field">
            <label>IPv6 Nebula</label>
            <input id="nm-ipv6-nebula" placeholder="fd00:1234:5678:a::x" />
          </div>
          <div class="field">
            <label>Groups</label>
            <input id="nm-groups" placeholder="home,ssh" />
          </div>
          <div class="field">
            <label>Порт Nebula</label>
            <input id="nm-port-nebula" type="number" placeholder="1194" />
          </div>
          <div class="field">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer">
              <input type="checkbox" id="nm-is-lh" style="width: auto; margin: 0" />
              Lighthouse / Relay
            </label>
          </div>
          <div class="field">
            <label>IP публичный</label>
            <input id="nm-ip-public" placeholder="85.140.x.x" />
          </div>
          <div class="field">
            <label>IP локальный</label>
            <input id="nm-ip-local" placeholder="192.168.x.x" />
          </div>
        </div>
        <div class="field">
          <label>Описание</label>
          <textarea id="nm-desc" rows="2" placeholder="Описание узла"></textarea>
        </div>
        <div class="btns">
          <button onclick="closeNodeModal()">Отмена</button>
          <button class="primary" onclick="saveNodeModal()">Сохранить</button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="link-modal">
      <div class="modal">
        <h3 id="link-modal-title">Связь</h3>
        <div class="field">
          <label>Тип связи</label>
          <select id="lm-type">
            <option value="physical">Физическая (Ethernet / оптика)</option>
            <option value="wifi">WiFi</option>
            <option value="virtual">Виртуальная (VLAN / VPN)</option>
          </select>
        </div>
        <div class="field">
          <label>Метка</label>
          <input id="lm-label" placeholder="Метка связи" />
        </div>
        <div class="field">
          <label>Детали</label>
          <textarea id="lm-details" rows="2" placeholder="VLAN ID, имя VPN и т.д."></textarea>
        </div>
        <div class="btns">
          <button onclick="closeLinkModal()">Отмена</button>
          <button class="primary" onclick="saveLinkModal()">Сохранить</button>
        </div>
      </div>
    </div>
    <div class="link-popup" id="link-popup">
      <button onclick="editLink()">✏️ Редактировать</button>
      <button class="del" onclick="deleteLink()">🗑 Удалить</button>
    </div>
    <div class="node-popup" id="node-popup">
      <button onclick="editNodeFromPopup()">✏️ Редактировать</button>
      <div class="separator"></div>
      <button class="del" onclick="deleteNodeFromPopup()">🗑 Удалить узел</button>
    </div>
    <div id="link-type-picker" class="link-type-picker">
      <div class="ltl">Тип связи:</div>
      <div class="ltb">
        <button data-type="physical" class="lt-btn" title="Физическая">🔌</button>
        <button data-type="wifi" class="lt-btn" title="WiFi">📶</button>
        <button data-type="virtual" class="lt-btn" title="Виртуальная">🌐</button>
      </div>
    </div>

    <!-- Настройки сети -->
    <div class="modal-overlay" id="net-settings-modal">
      <div class="modal">
        <h3>Настройки сети</h3>
        <div class="field">
          <label>Net Name</label>
          <input id="ns-net-name" placeholder="my-vpn-network" />
        </div>
        <div class="field">
          <label>Dev</label>
          <input id="ns-dev" placeholder="nebula1" />
        </div>
        <div class="btns">
          <button onclick="closeNetSettings()">Отмена</button>
          <button class="primary" onclick="saveNetSettings()">Сохранить</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
